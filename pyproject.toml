[project]
name = "ghosttrace"
version = "0.1.0"
description = "DVR/NVR digital-forensics workbench for evidence acquisition, video recovery, integrity verification, and reporting."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "GhostTrace", email = "ghosttrace@example.local"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
